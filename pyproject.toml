[build-system]
requires = ["setuptools>=61", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "scythe-transcribe"
version = "0.2.0"
description = "Local web transcription with Groq and OpenRouter"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "python-multipart>=0.0.9",
    "groq>=0.11.0",
    "httpx>=0.27.0",
    "python-dotenv>=1.0.0",
    "platformdirs>=4.0.0",
    "pystray>=0.19.0",
    "pillow>=10.0.0",
    "numpy>=1.26.0",
    "sounddevice>=0.5.0",
    "pynput>=1.7.0",
    "pyperclip>=1.9.0",
]

[project.scripts]
scythe-transcribe = "scythe_transcribe.main:run_app"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
scythe_transcribe = ["web_dist/*", "web_dist/**/*"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[dependency-groups]
dev = ["ruff>=0.8.0", "pytest>=8.0.0"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
